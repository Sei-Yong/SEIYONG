<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Protein Translation Tool</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5ef;color:#1c392f;font:15px/1.55 Inter,"Segoe UI",sans-serif}
main{max-width:1140px;margin:auto;padding:clamp(16px,4vw,50px)}nav a{color:#45634f;text-decoration:none}nav a:hover{text-decoration:underline}
header{margin:20px 0 16px;background:#193d32;color:#fbfff6;padding:clamp(23px,4vw,40px);border-radius:16px}
h1{margin:0;font:500 clamp(36px,5vw,57px)/1.06 Georgia,serif;letter-spacing:-.045em}
header p{color:#d7e7d8;margin:12px 0 0}
section{padding:clamp(16px,3vw,28px);margin-bottom:16px;background:white;border:1px solid #cddbd0;border-radius:15px}
.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(220px,1fr);gap:24px}
h2{font-size:20px;margin:0 0 12px}.label,legend{font-weight:650}
textarea{width:100%;margin-top:7px;padding:12px;background:#f8faf6;border:1px solid #afc3b5;border-radius:7px;resize:vertical;color:#193d32;font:15px/1.6 ui-monospace,Consolas,monospace}
fieldset{margin:0;padding:0;border:0}legend{padding:0;margin-bottom:5px}.choice{display:block;padding:4px 0}input{accent-color:#215e48}
.amber{margin-top:10px;border-top:1px solid #dce5dc;padding-top:10px}
button{margin-top:12px;background:#215e48;color:white;border:0;border-radius:7px;padding:10px 18px;font:650 15px/1.5 inherit;font-family:inherit;font-size:15px;font-weight:650;cursor:pointer}button:hover{background:#193d32}
:focus-visible{outline:3px solid #83a990;outline-offset:2px}
h3{margin:16px 0 6px;font-size:15px}.frame{border-top:1px solid #dce5dc}
pre{overflow:auto;background:#f5f8f3;padding:12px;margin:0 0 16px;border-radius:7px;font:14px/1.65 ui-monospace,Consolas,monospace}
.met{background:#f8e6a3;color:#483900;font-weight:700}.stop,.sup{color:#a03639;font-weight:700}
footer,.key{color:#526b59;font-size:13px}.key{margin:0 0 12px}#status:empty{display:none}
@media(max-width:660px){.layout{grid-template-columns:1fr;gap:12px}}
</style></head><body><main><nav><a href="AP-000-Main.html">← Back to Main</a></nav>
<header><h1>Protein Translation Tool</h1><p>Translate a DNA sequence in all six reading frames.</p></header>
<section><form id="form"><div class="layout"><div><label class="label" for="dna">DNA sequence (5′ → 3′)</label>
<textarea id="dna" rows="5" placeholder="Enter DNA using A, C, G and T" spellcheck="false" autocapitalize="off"></textarea></div>
<div><fieldset><legend>Output format</legend><label class="choice"><input type="radio" name="format" checked> Protein only</label>
<label class="choice"><input type="radio" name="format" id="aligned"> Align protein to DNA</label></fieldset>
<label class="choice amber"><input type="checkbox" id="amber"> Amber suppression (TAG → Q)</label></div></div>
<button type="submit">Translate</button><p id="status" role="status"></p></form></section>
<section id="results" hidden><h2>Reading frames</h2><p class="key"><span class="met">M</span> Methionine &nbsp; <span class="stop">*</span> Stop<span id="amberKey" hidden> &nbsp; <span class="sup">Q</span> Suppressed TAG</span></p><div id="frames"></div></section>
<footer>© 2025–2026 Sei-Yong Jun. All rights reserved.</footer></main>
<script>
const bases = 'TCAG';
const aminoAcids = 'FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';
const table = {};
for (const first of bases) for (const second of bases) for (const third of bases) {
  const codon = first + second + third;
  table[codon] = aminoAcids[Object.keys(table).length];
}
const complement = {A:'T', C:'G', G:'C', T:'A'};
function reverseComplement(dna) {
  return Array.from(dna).reverse().map(base => complement[base]).join('');
}
function proteinLine(dna, suppress, aligned) {
  let line = '';
  for (let i = 0; i + 2 < dna.length; i += 3) {
    const codon = dna.slice(i, i + 3);
    const amber = suppress && codon === 'TAG';
    const aa = amber ? 'Q' : table[codon];
    const style = amber ? 'sup' : aa === 'M' ? 'met' : aa === '*' ? 'stop' : '';
    const symbol = style ? '<span class="' + style + '">' + aa + '</span>' : aa;
    line += aligned ? ' ' + symbol + ' ' : symbol;
  }
  return line;
}
function formatFrame(dna, aligned, suppress) {
  const width = aligned ? 114 : 342;
  const lines = [];
  for (let i = 0; i < dna.length; i += width) {
    const segment = dna.slice(i, i + width);
    const protein = proteinLine(segment, suppress, aligned);
    if (aligned) lines.push(segment + '\n' + protein);
    else if (protein) lines.push(protein);
  }
  return lines.join(aligned ? '\n\n' : '\n');
}
const byId = id => document.getElementById(id);
byId('form').onsubmit = event => {
  event.preventDefault();
  const dna = byId('dna').value.toUpperCase().replace(/[^ATGC]/g, '');
  byId('results').hidden = true;
  byId('frames').replaceChildren();
  byId('status').textContent = '';
  if (dna.length < 3) {
    byId('status').textContent = 'Enter at least three DNA bases to translate.';
    return;
  }
  const aligned = byId('aligned').checked;
  const suppress = byId('amber').checked;
  byId('amberKey').hidden = !suppress;
  for (const [strand, sign] of [[dna, '+'], [reverseComplement(dna), '−']]) {
    for (let frame = 0; frame < 3; frame++) {
      const block = document.createElement('div');
      block.className = 'frame';
      const title = document.createElement('h3');
      title.textContent = 'Frame ' + sign + (frame + 1) + (sign === '+' ? ' · Forward' : ' · Reverse complement');
      const content = document.createElement('pre');
      content.innerHTML = formatFrame(strand.slice(frame), aligned, suppress);
      block.append(title, content);
      byId('frames').append(block);
    }
  }
  byId('results').hidden = false;
};
</script></body></html>
