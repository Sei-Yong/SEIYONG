<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sequence Alignment Tool</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5ef;color:#1c392f;font:15px/1.55 Inter,"Segoe UI",sans-serif}
main{max-width:1140px;margin:auto;padding:clamp(16px,4vw,50px)}nav a{color:#45634f;text-decoration:none}nav a:hover{text-decoration:underline}
header{margin:20px 0 16px;background:#193d32;color:#fbfff6;padding:clamp(23px,4vw,40px);border-radius:16px}
h1{margin:0;font:500 clamp(36px,5vw,57px)/1.06 Georgia,serif;letter-spacing:-.045em}
header p{color:#d7e7d8;margin:12px 0 0}
section{padding:clamp(16px,3vw,28px);margin-bottom:16px;background:white;border:1px solid #cddbd0;border-radius:15px}
.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(220px,1fr);gap:24px}
h2{font-size:20px;margin:0 0 12px}.label,legend{font-weight:650}
textarea{width:100%;margin-top:7px;padding:12px;background:#f8faf6;border:1px solid #afc3b5;border-radius:7px;resize:vertical;color:#193d32;font:15px/1.6 ui-monospace,Consolas,monospace}
fieldset{margin:0;padding:0;border:0}legend{padding:0;margin-bottom:5px}.choice{display:block;padding:4px 0}input{accent-color:#215e48}
.amber{margin-top:10px;border-top:1px solid #dce5dc;padding-top:10px}
button{margin-top:12px;background:#215e48;color:white;border:0;border-radius:7px;padding:10px 18px;font:650 15px/1.5 inherit;font-family:inherit;font-size:15px;font-weight:650;cursor:pointer}button:hover{background:#193d32}
:focus-visible{outline:3px solid #83a990;outline-offset:2px}
h3{margin:16px 0 6px;font-size:15px}.frame{border-top:1px solid #dce5dc}
pre{overflow:auto;background:#f5f8f3;padding:12px;margin:0 0 16px;border-radius:7px;font:14px/1.65 ui-monospace,Consolas,monospace}
.met{background:#f8e6a3;color:#483900;font-weight:700}.stop,.sup{color:#a03639;font-weight:700}
footer,.key{color:#526b59;font-size:13px}.key{margin:0 0 12px}#status:empty{display:none}

.layout{grid-template-columns:repeat(2,minmax(0,1fr))}

</style></head><body><main><nav><a href="AP-000-Main.html">← Back to Main</a></nav>
<header><h1>Sequence Alignment Tool</h1><p>Compare two DNA or protein sequences and inspect mismatches and gaps.</p></header>
<section><form id="form"><div class="layout"><div><label class="label" for="seq1">Sequence 1</label><textarea id="seq1" rows="4" placeholder="Paste the first sequence" spellcheck="false" required></textarea></div>
<div><label class="label" for="seq2">Sequence 2</label><textarea id="seq2" rows="4" placeholder="Paste the second sequence" spellcheck="false" required></textarea></div></div>
<button type="submit">Align sequences</button><p id="status" role="status"></p></form></section>
<section id="panel" hidden><h2>Pairwise alignment</h2><p id="identity"></p><p class="key">An asterisk marks a match. Highlighted columns show a mismatch or a gap.</p>
<pre id="alignmentResult" tabindex="0"></pre></section>
<footer>© 2025–2026 Sei-Yong Jun. All rights reserved.</footer></main>
<script>
function score(a, b) {
  if (a === b) return 2;
  return a === '-' || b === '-' ? -2 : -1;
}
function alignPart(a, b, local) {
  const m = a.length, n = b.length;
  const matrix = Array.from({length:m + 1}, () => new Float64Array(n + 1));
  let endI = 0, endJ = 0, best = 0;
  if (!local) {
    for (let i = 1; i <= m; i++) matrix[i][0] = -2 * i;
    for (let j = 1; j <= n; j++) matrix[0][j] = -2 * j;
  }
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const diag = matrix[i-1][j-1] + score(a[i-1], b[j-1]);
      const up = matrix[i-1][j] + (local ? score(a[i-1], '-') : -2);
      const left = matrix[i][j-1] + (local ? score('-', b[j-1]) : -2);
      const v = Math.max(diag, up, left, local ? 0 : -Infinity);
      matrix[i][j] = v;
      if (local && v > best) { best = v; endI = i; endJ = j; }
    }
  }
  let i = local ? endI : m, j = local ? endJ : n;
  const first = [], second = [];
  while ((i || j) && (!local || (i && j && matrix[i][j] > 0))) {
    if (i && j && matrix[i][j] === matrix[i-1][j-1] + score(a[i-1], b[j-1])) {
      first.push(a[--i]); second.push(b[--j]);
    } else if (i && (!j || matrix[i][j] === matrix[i-1][j] + (local ? score(a[i-1], '-') : -2))) {
      first.push(a[--i]); second.push('-');
    } else {
      first.push('-'); second.push(b[--j]);
    }
  }
  return {first:first.reverse().join(''), second:second.reverse().join(''), i, j, endI, endJ};
}
function align(a, b) {
  const core = alignPart(a,b,true);
  const before = alignPart(a.slice(0,core.i), b.slice(0,core.j), false);
  const after = alignPart(a.slice(core.endI), b.slice(core.endJ), false);
  return [before.first + core.first + after.first, before.second + core.second + after.second];
}
const byId = id => document.getElementById(id);
function clearResult() { byId('panel').hidden = true; byId('status').textContent = ''; }
byId('form').oninput = clearResult;
byId('form').onsubmit = event => {
  event.preventDefault();
  clearResult();
  const sequences = ['seq1','seq2'].map(id => byId(id).value.replace(/\s+/g,'').toUpperCase());
  if (sequences.some(seq => !seq)) { byId('status').textContent = 'Enter both sequences.'; return; }
  const [a,b] = align(...sequences);
  const result = byId('alignmentResult');
  result.replaceChildren();
  let matches = 0;
  for (let start = 0; start < a.length; start += 100) {
    let marks = '';
    const first = document.createDocumentFragment(), second = document.createDocumentFragment();
    for (let i = start; i < Math.min(start + 100,a.length); i++) {
      const same = a[i] === b[i];
      marks += same ? '*' : ' ';
      if (same) { matches++; first.append(a[i]); second.append(b[i]); }
      else {
        for (const [line,letter] of [[first,a[i]],[second,b[i]]]) {
          const span = document.createElement('span');
          span.className = 'mismatch'; span.textContent = letter; line.append(span);
        }
      }
    }
    result.append('Seq 1  ',first,'\n       ',marks,'\nSeq 2  ',second,'\n\n');
  }
  byId('identity').textContent = 'Sequence identity: ' + (100 * matches / a.length).toFixed(2) + '% (' + matches + ' / ' + a.length + ' aligned positions)';
  byId('panel').hidden = false;
};
</script></body></html>
