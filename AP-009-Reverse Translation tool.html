<header><h1>Reverse Translation Tool</h1><p>Generate a DNA sequence from a protein using the selected host’s codon frequencies.</p></header>
<section><form id="form"><div class="layout"><div><label class="label" for="proteinInput">Protein sequence</label>
<textarea id="proteinInput" rows="5" placeholder="Enter a continuous one-letter amino acid sequence" spellcheck="false" autocapitalize="off"></textarea></div>
<div><label class="label" for="hostSelect">Host organism</label>
<select id="hostSelect"><option value="ecoli">E. coli</option><option value="yeast">S. cerevisiae</option><option value="human">Homo sapiens</option></select>
<p class="key" style="margin-top:10px">Codons with a frequency of 15% or higher are sampled by weight. Results may vary between runs.</p></div></div>
<button type="submit">Reverse translate</button></form></section>
<section id="results" hidden><h2>DNA sequence</h2><pre id="ntOutput" aria-live="polite"></pre></section>

function runReverseTranslation() {
  const protein = document.getElementById('proteinInput').value.trim().toUpperCase();
  const host = document.getElementById('hostSelect').value;
  const codons = [];
  for (const aa of protein) {
    const options = codonUsage[host][aa] || [];
    const expanded = [];
    for (const [codon, frequency] of options) {
      if (frequency >= 0.15) {
        for (let i = 0; i < Math.round(frequency * 100); i++) expanded.push(codon);
      }
    }
    codons.push(expanded.length ? expanded[Math.floor(Math.random() * expanded.length)] : 'NNN');
  }
  const lines = [];
  for (let i = 0; i < codons.length; i += 20) lines.push(codons.slice(i, i + 20).join(' '));
  document.getElementById('ntOutput').textContent = lines.join('\n');
  document.getElementById('results').hidden = !codons.length;
}
document.getElementById('form').onsubmit = event => {
  event.preventDefault();
  runReverseTranslation();
};
